# The Pulso iPhone app. `xcodegen generate` (or `bun run ios:generate` from
# the root) writes Pulso.xcodeproj from this file. The project is generated,
# not committed: phone.sh and check.sh regenerate it.
#
# Debug is `com.facundo.pulso.dev`, Release `com.facundo.pulso`: two unrelated
# apps to iOS, each with its own pairing in its own Keychain.
name: Pulso
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: es
settings:
  base:
    DEVELOPMENT_TEAM: MM74W7WGAM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    PULSO_APP_BUNDLE_ID: com.facundo.pulso
  configs:
    Debug:
      PULSO_APP_BUNDLE_ID: com.facundo.pulso.dev
targets:
  Pulso:
    type: application
    platform: iOS
    sources:
      - path: Pulso
      - path: Shared
      - path: WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSO_APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulso
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: Pulso lee de Salud tus entrenamientos, actividad, sueño, frecuencia cardíaca, peso, composición corporal y medicamentos para guardarlos en tu Mac y calcular tu recuperación y tus proyecciones.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Pulso guarda en Salud tus sesiones de fuerza y de cardio como entrenamientos (con distancia y calorías cuando las anotas) y el agua que registras.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Pulso lee de tu Calendario sólo cuándo estás ocupado y el título de cada evento, para planificar tus entrenamientos alrededor. Nunca escribe en él.
        INFOPLIST_KEY_NSCameraUsageDescription: Pulso usa la cámara para escanear códigos de barras y el QR de InBody, y para mandarle fotos de tu comida al Coach.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Pulso usa Face ID para proteger tus datos de salud.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: Config/Pulso.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # xcodegen gives every iOS target "1,2"; iPhone only, said per target.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          INFOPLIST_KEY_CFBundleDisplayName: Pulso Dev
    dependencies:
      - target: PulsoActivity
      - target: PulsoWidgets
      - target: PulsoWatch
  # Live Activity (lock screen + Dynamic Island) for a strength session. It
  # shares TrainingActivityAttributes with the app; embedded by the dependency above.
  PulsoActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PulsoActivity
      - path: Pulso/Features/Training/TrainingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSO_APP_BUNDLE_ID).activity
        INFOPLIST_FILE: Config/PulsoActivity.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulso
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # Home Screen / Lock Screen widgets and the Control Center control. They read
  # the snapshot the app writes to the App Group (Shared/WidgetSnapshot.swift)
  # and reach the engine with the pairing the app mirrors to a shared Keychain group.
  PulsoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PulsoWidgets
      - path: Shared
      - path: Pulso/Design/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSO_APP_BUNDLE_ID).widgets
        INFOPLIST_FILE: Config/PulsoWidgets.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulso
        CODE_SIGN_ENTITLEMENTS: Config/PulsoWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # The Watch app: records the session's workout with the Watch's sensors and
  # mirrors it to the phone live (heart rate, energy, distance). Started from
  # the phone; WatchShared/WorkoutLink.swift is what the two say to each other.
  PulsoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: PulsoWatch
      - path: WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULSO_APP_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: Config/PulsoWatch.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulso
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(PULSO_APP_BUNDLE_ID)
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: Pulso lee tu frecuencia cardíaca, energía y distancia mientras entrenas para mostrarlas en tu iPhone.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Pulso guarda en Salud los entrenamientos que graba tu Apple Watch durante la sesión, para que cuenten en tus anillos.
        CODE_SIGN_ENTITLEMENTS: Config/PulsoWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Debug:
          INFOPLIST_KEY_CFBundleDisplayName: Pulso Dev
  PulsoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulsoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facundo.pulso.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pulso
schemes:
  Pulso:
    build:
      targets:
        Pulso: all
        PulsoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PulsoTests
    archive:
      config: Release
